services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Ensure Python print/traceback output appears promptly in Docker logs.
      PYTHONUNBUFFERED: "1"
      # Explicit read-only test hosts; only use in local development.
      ANALYZER_ALLOWED_HOSTS: "example.com,www.alhashmyahh.com,alhashmyahh.com"
    ports:
      - "${BACKEND_PORT:-7001}:${BACKEND_PORT:-7001}"
    command: poetry run uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-7001}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # The Vite proxy runs INSIDE the frontend container, so localhost
      # would point to the frontend rather than the backend container.
      # Docker Compose service DNS resolves "backend" on the default network.
      PROXY_CODEGEN_BACKEND: http://backend:${BACKEND_PORT:-7001}
    depends_on:
      - backend
    ports:
      - "5173:5173"
